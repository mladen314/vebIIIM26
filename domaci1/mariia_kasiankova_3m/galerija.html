<!DOCTYPE html>
<html lang="cnr">
<head>
  
    <meta charset="UTF-8">

    <title>Mariia Kasiankova – Galerija</title>


    <link rel="icon" type="image/png" href="slike/favicon.png">

    <!-- Оформление галереи и меню -->
    <style>
        /* Главное меню для перехода между страницами */
        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            background-color: #3b4d32;
            padding: 15px;
            border-radius: 8px;
        }

        /* Ссылки в главном меню */
        nav a {
            color: #f2ede4;
            font-weight: bold;
            text-decoration: none;
            font-size: 20px;
        }

        /* Расположение фотографий в несколько рядов */
        #galerija {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px auto;
            width: 95%;
            max-width: 1200px;
        }

        /* Одинаковая высота фотографий с сохранением пропорций */
        #galerija img {
            display: block;
            height: 220px;
            max-width: 100%;
            width: auto;
            object-fit: contain;
            border: 3px solid #3b4d32;
        }

        /* Уменьшение высоты фотографий на маленьких экранах */
        @media (max-width: 600px) {
            nav {
                gap: 15px;
            }

            nav a {
                font-size: 17px;
            }

            #galerija img {
                height: 160px;
            }
        }
    </style>
</head>

<body style="background-color: #f2ede4; font-family: 'Times New Roman', Times, serif; color: #2c251e; margin: 0; padding: 20px;">
