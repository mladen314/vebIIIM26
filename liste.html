<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste</title>

    <style>
        li:nth-child(even){
            color: aqua;
        }
         li:nth-child(odd){
            color: blue;
        }
        li:nth-child(3){
            color: red;
        }
    </style>
</head>

<body>

    <ul style="list-style-type: square;">
        <li>Kafa</li>
        <li>Caj
            <ul>
                <li>Zeleni</li>
                <li>Crni</li>
            </ul>
        </li>
        <li>Mlijeko</li>
    </ul>

    <h1>Casovi cetvrtkom</h1>
    <ol>
        <li>Matematika 1J</li>
        <li>Matematika 1J</li>
        <li>Pauza</li>
        <li>Programiranje i programsko jezici 3M</li>
    </ol>

</body>

</html>
